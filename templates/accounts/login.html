{% extends "base.html" %}

{% block title %}Sign in - AdventureWorks BI{% endblock %}

{% block content %}
<div class="min-h-[82vh] flex items-center justify-center px-4">
    <div class="w-full max-w-md bg-white p-8 rounded-2xl shadow-lg border border-slate-200/80 space-y-6">
        <div class="text-center space-y-2">
            <div class="w-11 h-11 rounded-xl bg-coral text-white flex items-center justify-center font-bold text-lg shadow-sm mx-auto">A</div>
            <h1 class="text-xl font-bold text-slate-900 tracking-tight">AdventureWorks BI</h1>
            <p class="text-xs text-slate-500">Sign in to access analytics, reports, and governance</p>
        </div>

        <form method="post" action="{% url 'login' %}" class="space-y-4">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ request.GET.next|default:'' }}">
            <div>
                <label for="username" class="block text-xs font-semibold text-slate-700 mb-1">Username</label>
                <input type="text" name="username" id="username" required placeholder="Enter your username"
                    class="block w-full px-3.5 py-2.5 border border-slate-200 rounded-xl bg-slate-50/50 focus:bg-white shadow-sm focus:outline-none focus:ring-2 focus:ring-coral/30 focus:border-coral text-sm transition">
            </div>

            <div>
                <label for="password" class="block text-xs font-semibold text-slate-700 mb-1">Password</label>
                <input type="password" name="password" id="password" required placeholder="Enter your password"
                    class="block w-full px-3.5 py-2.5 border border-slate-200 rounded-xl bg-slate-50/50 focus:bg-white shadow-sm focus:outline-none focus:ring-2 focus:ring-coral/30 focus:border-coral text-sm transition">
            </div>

            <button type="submit"
                class="w-full bg-coral hover:bg-coral-hover text-white font-semibold py-2.5 px-4 rounded-xl shadow-sm transition text-sm">
                Sign in
            </button>
        </form>

        <!-- Demo logins -->
        <div class="pt-5 border-t border-slate-100">
            <p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-3 text-center">
                Quick demo accounts
            </p>
            <div class="grid grid-cols-2 gap-2 text-xs">
                <button type="button" onclick="fillLogin('admin', 'Admin123!')" class="p-2.5 border border-slate-200 rounded-xl hover:border-coral-border hover:bg-coral-light/50 text-left transition group">
                    <div class="flex items-center justify-between">
                        <span class="font-bold text-slate-800 group-hover:text-coral">Administrator</span>
                        <span class="w-2 h-2 rounded-full bg-coral"></span>
                    </div>
                    <span class="text-[10px] text-slate-400 block mt-0.5">Full access + Audit</span>
                </button>
                <button type="button" onclick="fillLogin('manager', 'Manager123!')" class="p-2.5 border border-slate-200 rounded-xl hover:border-blue-200 hover:bg-blue-50/50 text-left transition group">
                    <div class="flex items-center justify-between">
                        <span class="font-bold text-slate-800 group-hover:text-blue-700">Manager</span>
                        <span class="w-2 h-2 rounded-full bg-blue-500"></span>
                    </div>
                    <span class="text-[10px] text-slate-400 block mt-0.5">All 4 reports</span>
                </button>
                <button type="button" onclick="fillLogin('supervisor', 'Supervisor123!')" class="p-2.5 border border-slate-200 rounded-xl hover:border-emerald-200 hover:bg-emerald-50/50 text-left transition group">
                    <div class="flex items-center justify-between">
                        <span class="font-bold text-slate-800 group-hover:text-emerald-700">Supervisor</span>
                        <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                    </div>
                    <span class="text-[10px] text-slate-400 block mt-0.5">Sales &amp; Customers</span>
                </button>
                <button type="button" onclick="fillLogin('employee', 'Employee123!')" class="p-2.5 border border-slate-200 rounded-xl hover:border-slate-300 hover:bg-slate-50 text-left transition group">
                    <div class="flex items-center justify-between">
                        <span class="font-bold text-slate-800">Employee</span>
                        <span class="w-2 h-2 rounded-full bg-slate-400"></span>
                    </div>
                    <span class="text-[10px] text-slate-400 block mt-0.5">Sales view-only</span>
                </button>
            </div>
        </div>
    </div>
</div>

<script>
function fillLogin(u, p) {
    document.getElementById('username').value = u;
    document.getElementById('password').value = p;
}
</script>
{% endblock %}
