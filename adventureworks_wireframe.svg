    <text x="918" y="46" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">Share Section</text>

    <rect x="1016" y="24" width="34" height="34" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
    <text x="1027" y="45" font-family="'Inter', sans-serif" font-size="14" fill="#9CA3AF">···</text>

    <!-- Header Section -->
