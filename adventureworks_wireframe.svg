    <circle cx="48" cy="810" r="14" fill="#1E293B"/>
    <text x="41" y="814" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF">LV</text>
    <text x="70" y="806" class="text-body" font-size="11" font-weight="700">Lei Ivan V.</text>
    <text x="70" y="820" class="text-muted" font-size="10">Admin / Lead</text>
