    <!-- Nav Sub-group -->
    <text x="60" y="411" class="text-body" fill="#6B7280">Data Governance</text>
    <text x="60" y="447" class="text-body" fill="#6B7280">Settings</text>
    <text x="60" y="483" class="text-body" fill="#6B7280">RBAC Security</text>

