    <rect x="330" y="392" width="60" height="18" rx="9" fill="#F3F4F6"/>
    <text x="340" y="405" class="text-muted" font-size="10" fill="#374151">#bikes</text>
    <rect x="396" y="392" width="76" height="18" rx="9" fill="#F3F4F6"/>
    <text x="406" y="405" class="text-muted" font-size="10" fill="#374151">#mountain</text>
