<svg width="1340" height="860" viewBox="0 0 1340 860" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .text-title { font-family: 'Inter', -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .text-subtitle { font-family: 'Inter', -apple-system, sans-serif; font-size: 12px; font-weight: 400; fill: #6B7280; }
      .text-section { font-family: 'Inter', -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #111827; }
      .text-body { font-family: 'Inter', -apple-system, sans-serif; font-size: 12px; font-weight: 500; fill: #374151; }
      .text-muted { font-family: 'Inter', -apple-system, sans-serif; font-size: 11px; font-weight: 400; fill: #9CA3AF; }
      .text-metric { font-family: 'Inter', -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #111827; }
      .text-badge { font-family: 'Inter', -apple-system, sans-serif; font-size: 10px; font-weight: 600; }
