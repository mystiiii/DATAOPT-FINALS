    <line x1="42" y1="98" x2="46" y2="102" stroke="#9CA3AF" stroke-width="1.5"/>
    <text x="52" y="98" class="text-muted">Search metrics...</text>

    <!-- Nav 1: Dashboard (ACTIVE) -->
