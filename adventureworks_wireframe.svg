    <rect x="1030" y="360" width="286" height="40" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
    <text x="1044" y="385" font-size="12">📄</text>
    <text x="1068" y="384" class="text-body" font-size="11">adventureworks2019-schema.sql</text>

    <rect x="1030" y="408" width="286" height="40" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
    <text x="1044" y="433" font-size="12">📽️</text>
    <text x="1068" y="432" class="text-body" font-size="11">query-execution-plan.xml</text>

    <rect x="1030" y="456" width="286" height="40" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
    <text x="1044" y="481" font-size="12">📊</text>
    <text x="1068" y="480" class="text-body" font-size="11">product-margin-matrix.csv</text>

    <!-- Thumbnails -->
    <rect x="1030" y="508" width="138" height="64" rx="12" fill="#F3F4F6" stroke="#E5E7EB"/>
    <text x="1040" y="556" class="text-muted" font-size="9" font-weight="600">ER-Diagram.png</text>

    <rect x="1178" y="508" width="138" height="64" rx="12" fill="#F3F4F6" stroke="#E5E7EB"/>
    <text x="1188" y="556" class="text-muted" font-size="9" font-weight="600">Index-Analysis.png</text>
