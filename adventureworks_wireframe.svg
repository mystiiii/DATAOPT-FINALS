    <line x1="220" y1="0" x2="220" y2="860" stroke="#F0F2F5" stroke-width="1.5"/>

    <!-- Brand Logo -->
    <rect x="24" y="24" width="32" height="32" rx="10" fill="#FF5A36"/>
    <text x="35" y="46" font-family="'Inter', sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">⚡</text>
    <text x="64" y="46" class="text-title" font-size="16">AdventureWorks</text>

    <!-- Search Input -->
    <rect x="24" y="76" width="172" height="36" rx="10" fill="#F7F8FA" stroke="#EBECEF"/>
    <circle cx="38" cy="94" r="5" stroke="#9CA3AF" stroke-width="1.5" fill="none"/>
    <line x1="42" y1="98" x2="46" y2="102" stroke="#9CA3AF" stroke-width="1.5"/>
    <text x="52" y="98" class="text-muted">Search reports...</text>

    <!-- Navigation Items -->
    <!-- Nav 1: Dashboard -->
    <rect x="24" y="128" width="172" height="36" rx="10" fill="transparent"/>
    <rect x="36" y="139" width="14" height="14" rx="2" stroke="#6B7280" stroke-width="1.5" fill="none"/>
    <text x="60" y="151" class="text-body" fill="#6B7280">Dashboard</text>

    <!-- Nav 2: Task Optimization -->
    <rect x="24" y="168" width="172" height="36" rx="10" fill="transparent"/>
    <rect x="36" y="179" width="14" height="14" rx="2" stroke="#6B7280" stroke-width="1.5" fill="none"/>
    <text x="60" y="191" class="text-body" fill="#6B7280">Task Optimization</text>

    <!-- Nav 3: Sales Report (ACTIVE) -->
    <rect x="24" y="208" width="172" height="36" rx="10" fill="#FFF2EE" stroke="#FFE3DB"/>
    <rect x="36" y="219" width="14" height="14" rx="2" stroke="#FF5A36" stroke-width="1.5" fill="#FF5A36"/>
    <text x="60" y="231" class="text-body" font-weight="700" fill="#FF5A36">Sales Report</text>

    <!-- Nav 4: Customer Profile -->
    <rect x="24" y="248" width="172" height="36" rx="10" fill="transparent"/>
    <rect x="36" y="259" width="14" height="14" rx="2" stroke="#6B7280" stroke-width="1.5" fill="none"/>
    <text x="60" y="271" class="text-body" fill="#6B7280">Customer Profile</text>

    <!-- Nav 5: Revenue & Loss -->
    <rect x="24" y="288" width="172" height="36" rx="10" fill="transparent"/>
    <rect x="36" y="299" width="14" height="14" rx="2" stroke="#6B7280" stroke-width="1.5" fill="none"/>
    <text x="60" y="311" class="text-body" fill="#6B7280">Revenue &amp; Loss</text>

    <!-- Nav 6: Cost Analysis -->
    <rect x="24" y="328" width="172" height="36" rx="10" fill="transparent"/>
    <rect x="36" y="339" width="14" height="14" rx="2" stroke="#6B7280" stroke-width="1.5" fill="none"/>
    <text x="60" y="351" class="text-body" fill="#6B7280">Cost Analysis</text>

