    <text x="558" y="461" class="text-badge" fill="#065F46">Finished</text>
    <text x="960" y="461" class="text-muted">&rsaquo;</text>

    <!-- Card 4 (Collapsed) -->
    <rect x="244" y="492" width="736" height="46" rx="14" fill="#FFFFFF" stroke="#E5E7EB"/>
    <text x="264" y="520" class="text-muted" font-size="14">≡</text>
    <text x="288" y="519" class="text-body" font-weight="700">Data Limitation: Date Truncation (Mid-2014)</text>
    <rect x="564" y="506" width="56" height="18" rx="9" fill="#FEF3C7"/>
    <text x="575" y="519" class="text-badge" fill="#92400E">On-Hold</text>
    <text x="960" y="519" class="text-muted">&rsaquo;</text>

    <!-- Bottom Filter Composer Bar -->
    <line x1="244" y1="764" x2="980" y2="764" stroke="#F0F2F5"/>
    <text x="244" y="790" class="text-muted">Describe custom SQL filter or date query parameter...</text>
    <rect x="244" y="802" width="104" height="34" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
    <text x="258" y="824" class="text-body" font-size="11">+ Filter Preset</text>

    <rect x="356" y="802" width="112" height="34" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
    <text x="370" y="824" class="text-body" font-size="11">✨ Ask With AI ⌵</text>

