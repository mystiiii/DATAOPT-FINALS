    <rect x="1190" y="218" width="16" height="58" rx="8" fill="#FFE3DB"/>
    <text x="1188" y="290" class="text-muted" font-size="9">2014*</text>

    <rect x="1234" y="244" width="16" height="32" rx="8" fill="#FFE3DB"/>
